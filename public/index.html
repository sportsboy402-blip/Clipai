<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ClipAI</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#080a0f;
  color:white;
  font-family:Arial,sans-serif
}

.app{
  max-width:650px;
  margin:auto;
  padding:30px 18px 50px
}

.logo{
  font-size:30px;
  font-weight:800;
  margin-bottom:6px
}

.subtitle{
  color:#8d95a5;
  margin-bottom:30px
}

.card{
  background:#11151d;
  border:1px solid #252b36;
  border-radius:20px;
  padding:20px
}

h2{
  margin-top:0
}

input{
  width:100%;
  padding:16px;
  border-radius:12px;
  border:1px solid #343b48;
  background:#080a0f;
  color:white;
  font-size:16px
}

button{
  width:100%;
  margin-top:12px;
  padding:15px;
  border:0;
  border-radius:12px;
  background:#7c3aed;
  color:white;
  font-size:16px;
  font-weight:bold
}

.status{
  margin-top:18px;
  color:#aeb6c5
}

#results{
  display:none;
  margin-top:25px
}

.found{
  font-size:20px;
  font-weight:bold;
  margin-bottom:15px
}

.moment{
  background:#171c25;
  border:1px solid #292f3a;
  border-radius:16px;
  padding:18px;
  margin-bottom:14px
}

.moment h3{
  margin:0 0 12px;
  font-size:18px;
  line-height:1.4
}

.time{
  color:#a78bfa;
  font-weight:bold;
  margin-bottom:10px
}

.description{
  color:#d6dae2;
  line-height:1.5;
  margin-bottom:10px
}

.reason{
  color:#969ead;
  line-height:1.5;
  font-size:14px
}

.small{
  color:#697180;
  font-size:13px;
  text-align:center;
  margin-top:20px
}
</style>
</head>

<body>

<div class="app">

<div class="logo">✦ ClipAI</div>

<div class="subtitle">
Temukan momen menarik dari video
</div>

<div class="card">

<h2>🎬 Analisis Video</h2>

<input
id="url"
type="url"
placeholder="Tempel URL YouTube di sini..."
>

<button onclick="analyzeVideo()">
🔍 Analisis Video
</button>

<div id="status" class="status"></div>

<div id="results">

<div class="found">
✨ Momen yang ditemukan
</div>

<div id="moment-list"></div>

</div>

</div>

<div class="small">
ClipAI • Video Moment Analyzer
</div>

</div>

<script>

async function analyzeVideo(){

const url =
document.getElementById("url").value.trim();

const status =
document.getElementById("status");

const results =
document.getElementById("results");

const list =
document.getElementById("moment-list");

if(!url){

status.textContent =
"⚠️ Tempel URL YouTube terlebih dahulu.";

return;

}

status.textContent =
"⏳ Gemini sedang menganalisis video...";

results.style.display="none";
list.innerHTML="";

try{

const response =
await fetch("/api/analyze-url",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
url:url
})

});

const data =
await response.json();

if(!response.ok){

throw new Error(
data.error || "Analisis gagal."
);

}

const moments =
data.moments || [];

if(!moments.length){

throw new Error(
"Tidak ada momen yang ditemukan."
);

}

moments.forEach((moment,index)=>{

const card =
document.createElement("div");

card.className="moment";

card.innerHTML=`

<h3>
${index+1}. ${escapeHtml(moment.title)}
</h3>

<div class="time">
⏱ ${escapeHtml(moment.start)}
–
${escapeHtml(moment.end)}
</div>

<div class="description">
${escapeHtml(moment.description)}
</div>

<div class="reason">
💡 Alasan menarik:
${escapeHtml(moment.reason)}
</div>

`;

list.appendChild(card);

});

status.textContent =
"✅ Selesai — "
+ moments.length
+ " momen ditemukan.";

results.style.display="block";

}catch(error){

status.textContent =
"❌ " + error.message;

}

}


function escapeHtml(value){

return String(value ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

</script>

</body>
</html>
